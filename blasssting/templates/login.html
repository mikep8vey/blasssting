<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BLASSS TING — Admin Login</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <main class="login-card">
        <img class="login-logo" src="{{ url_for('static', filename='logo.svg') }}" alt="BLASSS TING">
        <h1>BLASSS TING</h1>
        <p class="muted">Secure administrator access</p>
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        <form method="post" action="{{ url_for('do_login') }}">
            <label>Username</label>
            <input type="text" name="username" autocomplete="username" required autofocus>
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
            <button class="primary full" type="submit">Sign in</button>
        </form>
        <p class="security-note">Your BLASSS TING administrator password is separate from your VPS password.</p>
    </main>
</body>
</html>
